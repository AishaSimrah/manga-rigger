<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga Rigger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Manga Rigger</h1></header>
  <main>
    <aside>
      <section>
        <h2>1. Add a character</h2>
        <form id="upload-form">
          <input type="text" id="char-name" placeholder="Character name">
          <input type="file" id="char-file" accept="image/*" required>
          <label><input type="checkbox" id="remove-bg"> Remove background (needs rembg)</label>
          <button type="submit">Upload</button>
        </form>
        <ul id="char-list"></ul>
      </section>

      <section>
        <h2>2. Rig the face</h2>
        <div id="part-buttons">
          <button class="part-btn" data-part="left_eye">Left eye</button>
          <button class="part-btn" data-part="right_eye">Right eye</button>
          <button class="part-btn" data-part="mouth">Mouth</button>
        </div>
        <p class="hint">Pick a part, then drag a tight box over it on the picture (Rig mode).</p>
        <button id="clear-part">Clear selected part</button>
      </section>

      <section>
        <h2>3. Motion settings</h2>
        <label>Breathing amount <input type="range" data-setting="breath_amount" min="0" max="0.05" step="0.001"></label>
        <label>Breathing speed <input type="range" data-setting="breath_speed" min="0.1" max="1" step="0.05"></label>
        <label>Blink: shortest gap (s) <input type="range" data-setting="blink_min" min="0.5" max="10" step="0.5"></label>
        <label>Blink: longest gap (s) <input type="range" data-setting="blink_max" min="1" max="15" step="0.5"></label>
        <label>Mouth sensitivity <input type="range" data-setting="mouth_sensitivity" min="1" max="12" step="0.5"></label>
      </section>

      <section>
        <h2>4. Audio, preview, export</h2>
        <label>Dialogue audio <input type="file" id="audio-file" accept="audio/*"></label>
        <audio id="audio" controls></audio>
        <div>
          <label><input type="radio" name="mode" value="rig" checked> Rig mode</label>
          <label><input type="radio" name="mode" value="preview"> Preview mode</label>
        </div>
        <label>Background <input type="color" id="bg-color" value="#f4f4f4"></label>
        <button id="record-btn">Record video (.webm)</button>
      </section>
    </aside>

    <section id="stage">
      <canvas id="stage-canvas"></canvas>
      <p id="status">Upload a character to begin.</p>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
